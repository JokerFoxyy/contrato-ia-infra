name: Terraform

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feature/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.7.0'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Plan — roda em PRs e push na main (sempre plan primeiro)
  # ──────────────────────────────────────────────────────────────────────────
  plan:
    name: "Terraform Plan (${{ github.event.inputs.environment || 'production' }})"
    runs-on: ubuntu-latest
    # Não roda plan em PRs de forks (segurança: fork não tem acesso aos secrets)
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event.inputs.action == 'plan' ||
      (github.event_name == 'push')
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Terraform Init
        working-directory: environments/${{ github.event.inputs.environment || 'production' }}
        run: terraform init

      - name: Terraform Validate
        working-directory: environments/${{ github.event.inputs.environment || 'production' }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: environments/${{ github.event.inputs.environment || 'production' }}
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.TF_VAR_DB_USERNAME }}
          TF_VAR_claude_api_key: ${{ secrets.TF_VAR_CLAUDE_API_KEY }}
          TF_VAR_keycloak_issuer_uri: ${{ secrets.TF_VAR_KEYCLOAK_ISSUER_URI }}
          TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_STRIPE_WEBHOOK_SECRET }}

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${process.env.PLAN_OUTPUT || 'Plan generated successfully. See workflow logs for details.'}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ──────────────────────────────────────────────────────────────────────────
  # Apply — apenas via workflow_dispatch manual
  # ──────────────────────────────────────────────────────────────────────────
  apply:
    name: "Terraform Apply (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Terraform Init
        working-directory: environments/${{ github.event.inputs.environment }}
        run: terraform init

      - name: Terraform Apply
        working-directory: environments/${{ github.event.inputs.environment }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.TF_VAR_DB_USERNAME }}
          TF_VAR_claude_api_key: ${{ secrets.TF_VAR_CLAUDE_API_KEY }}
          TF_VAR_keycloak_issuer_uri: ${{ secrets.TF_VAR_KEYCLOAK_ISSUER_URI }}
          TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_STRIPE_WEBHOOK_SECRET }}
